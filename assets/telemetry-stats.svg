<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="100%" role="img" aria-label="GitHub Live Telemetry Stats">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C14"/>
      <stop offset="100%" stop-color="#0A141E"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .ringAnim {
        stroke-dasharray: 351.9;
        stroke-dashoffset: 31.7;
        animation: ringGrow 1.4s ease-out forwards;
      }
      @keyframes ringGrow {
        from { stroke-dashoffset: 351.9; }
        to { stroke-dashoffset: 31.7; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="598" height="288" rx="16" fill="url(#stBg)" stroke="#1C2B3D" stroke-width="1.5"/>
  <path d="M 10 22 L 10 10 L 22 10" fill="none" stroke="#00FF88" stroke-width="1.8" stroke-linecap="round"/><path d="M 578 10 L 590 10 L 590 22" fill="none" stroke="#00FF88" stroke-width="1.8" stroke-linecap="round"/><path d="M 10 268 L 10 280 L 22 280" fill="none" stroke="#00FF88" stroke-width="1.8" stroke-linecap="round"/><path d="M 578 280 L 590 280 L 590 268" fill="none" stroke="#00FF88" stroke-width="1.8" stroke-linecap="round"/>

  <circle cx="32" cy="30" r="4.5" fill="#00FF88"/>
  <text x="46" y="34" class="mono" font-size="12.5" font-weight="700" fill="#F0F6FC" letter-spacing="1">04 // GITHUB TELEMETRY</text>
  <rect x="412" y="18" width="162" height="22" rx="11" fill="#091B18" stroke="#155E42" stroke-width="1"/>
  <text x="493" y="33" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#00FF88">BASELINE SPEC</text>
  <line x1="24" y1="54" x2="576" y2="54" stroke="#152436" stroke-width="1"/>

  <rect x="26" y="77" width="340" height="25" rx="6" fill="#0B131E"/><circle cx="40" cy="89.5" r="3.5" fill="#FFB800"/><text x="54" y="94" class="sans" font-size="12.5" font-weight="500" fill="#C9D1D9">Total Stars Earned</text><text x="352" y="94" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#FFB800">4</text><rect x="26" y="109" width="340" height="25" rx="6" fill="#0B131E"/><circle cx="40" cy="121.5" r="3.5" fill="#00FF88"/><text x="54" y="126" class="sans" font-size="12.5" font-weight="500" fill="#C9D1D9">Yearly Commits</text><text x="352" y="126" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#00FF88">148</text><rect x="26" y="141" width="340" height="25" rx="6" fill="#0B131E"/><circle cx="40" cy="153.5" r="3.5" fill="#00E5FF"/><text x="54" y="158" class="sans" font-size="12.5" font-weight="500" fill="#C9D1D9">Active Repositories</text><text x="352" y="158" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#00E5FF">9</text><rect x="26" y="173" width="340" height="25" rx="6" fill="#0B131E"/><circle cx="40" cy="185.5" r="3.5" fill="#A855F7"/><text x="54" y="190" class="sans" font-size="12.5" font-weight="500" fill="#C9D1D9">Pull Requests &amp; Issues</text><text x="352" y="190" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#A855F7">14 / 6</text><rect x="26" y="205" width="340" height="25" rx="6" fill="#0B131E"/><circle cx="40" cy="217.5" r="3.5" fill="#38BDF8"/><text x="54" y="222" class="sans" font-size="12.5" font-weight="500" fill="#C9D1D9">Followers / Forks</text><text x="352" y="222" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#38BDF8">12 / 1</text>

