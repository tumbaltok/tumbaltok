  <circle cx="480" cy="146" r="56" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 480 146)" class="ringAnim"/>
  <text x="480" y="149" text-anchor="middle" class="sans" font-size="30" font-weight="900" fill="#00FF88">S</text>
  <text x="480" y="168" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#00E5FF">91th PCT</text>
